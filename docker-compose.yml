services:
  victim:
    build: .
    image: padding-oracle-soc-lab-base
    container_name: victim
    command: python victim/app.py
    environment:
      VICTIM_MODE: vuln
      SCENARIO_ID: default
      LOG_DIR: /logs
    volumes:
      - .:/app
      - ram-logs:/logs
    ports:
      - "18080:8080"

  attacker:
    build: .
    image: padding-oracle-soc-lab-base
    container_name: attacker
    command: sleep infinity
    environment:
      LOG_DIR: /logs
    volumes:
      - .:/app
      - ram-logs:/logs
    depends_on:
      - victim

  benign:
    build: .
    image: padding-oracle-soc-lab-base
    container_name: benign
    command: sleep infinity
    environment:
      LOG_DIR: /logs
    volumes:
      - .:/app
      - ram-logs:/logs
    depends_on:
      - victim

  soc:
    build: .
    image: padding-oracle-soc-lab-base
    container_name: soc
    command: python soc/collector.py
    environment:
      LOG_DIR: /logs
      SOC_WINDOW_MINUTES: 0
    volumes:
      - .:/app
      - ram-logs:/logs
    ports:
      - "18090:8090"
    restart: unless-stopped

  soc-ui:
    build: .
    image: padding-oracle-soc-lab-base
    container_name: soc-ui
    command: python soc/dashboard.py
    environment:
      LAB_ROOT: /home/sysadmin/test/padding-oracle-soc-lab
      LOG_DIR: /logs
      ALERT_RULES_FILE: /home/sysadmin/test/padding-oracle-soc-lab/control/alert_rules.json
      LAB_NETWORK: padding-oracle-soc-lab_default
      UI_PORT: "8091"
    volumes:
      - .:/app
      - /home/sysadmin/test/padding-oracle-soc-lab:/home/sysadmin/test/padding-oracle-soc-lab
      - /var/run/docker.sock:/var/run/docker.sock
      - ram-logs:/logs
    ports:
      - "18091:8091"
    depends_on:
      - soc
    restart: unless-stopped

volumes:
  ram-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512M


